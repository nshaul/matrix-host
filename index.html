<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020804" />
    <title>Matrix Host — living hologram avatar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #020804; overflow: hidden; }
      body.transparent-mode { background: transparent; }
      /* Checkerboard proves transparency in the demo; OBS sees true alpha. */
      body.transparent-mode.show-checker {
        background: repeating-conic-gradient(#2a2a2a 0% 25%, #3a3a3a 0% 50%) 0 0 / 28px 28px;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { width: 100%; height: 100%; display: block; }
      #panel {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        display: flex; flex-direction: column; gap: 8px;
        font: 12px/1.4 ui-monospace, Consolas, monospace; color: #baf5d0;
        background: #04140acc; border: 1px solid #1e5c36; border-radius: 10px;
        padding: 12px; width: 232px; backdrop-filter: blur(6px);
      }
      #panel h1 { font-size: 12px; letter-spacing: .14em; color: #6fe89b; text-transform: uppercase; }
      #panel .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      #panel button, #panel select, #panel label.file {
        font: inherit; color: #d7ffe6; background: #0a2415; border: 1px solid #1e5c36;
        border-radius: 6px; padding: 5px 8px; cursor: pointer;
      }
      #panel button:hover, #panel label.file:hover { background: #123a22; }
      #panel button.active { background: #1e5c36; }
      #panel button:disabled { opacity: .4; cursor: not-allowed; }
      #panel input[type="range"] { width: 100%; accent-color: #43e07c; }
      #panel .hint { color: #5a8a6c; font-size: 11px; }
      #panel input[type="file"] { display: none; }
      #fps { position: fixed; right: 12px; top: 12px; z-index: 10; font: 11px ui-monospace, monospace; color: #43e07c; background: #04140acc; padding: 4px 8px; border-radius: 6px; border: 1px solid #1e5c36; }
      #panel .group { border-top: 1px solid #1e5c36; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel">
      <h1>Matrix Host</h1>
      <div class="row">
        <select id="subject-select">
          <option value="./avatars/alicia.vrm" selected>Alicia (twin-tails)</option>
          <option value="./avatars/victoria.vrm">Victoria (woman)</option>
          <option value="./avatars/schoolgirl.vrm">School girl</option>
          <option value="./avatars/guy.vrm">Guy</option>
          <option value="./avatars/girl.vrm">Girl (short hair)</option>
          <option value="./avatars/boy.vrm">Boy</option>
        </select>
        <label class="file">Drop-in VRM<input id="subject-file" type="file" accept=".vrm,.glb" /></label>
      </div>
      <div class="group">
        <div class="row">
          <button id="bg-matrix" class="active">Matrix scene</button>
          <button id="bg-transparent">Transparent</button>
        </div>
        <span class="hint" id="bg-hint">Transparent = OBS/Whatnot overlay (true alpha)</span>
      </div>
      <div class="group">
        <label>Head yaw <input id="yaw" type="range" min="-60" max="60" value="0" /></label>
        <label>Head pitch <input id="pitch" type="range" min="-30" max="30" value="0" /></label>
        <div class="row">
          <button id="wave">👋 Wave</button>
          <button id="point">👉 Point</button>
          <button id="scold">🫵 Scold</button>
          <button id="yell">😠 Yell</button>
        </div>
        <div class="row">
          <select id="emotion">
            <option value="neutral" selected>Neutral</option>
            <option value="happy">Happy</option>
            <option value="angry">Angry</option>
            <option value="sad">Sad</option>
            <option value="relaxed">Relaxed</option>
          </select>
          <button id="orbit">Orbit: drag</button>
        </div>
      </div>
      <div class="group">
        <div class="row">
          <button id="speak-demo">🗣 Speak (demo)</button>
          <label class="file">Audio file<input id="speak-file" type="file" accept="audio/*" /></label>
          <button id="mic">🎙 Mic</button>
        </div>
        <span class="hint">Wire ElevenLabs: host.speak(audioUrl)</span>
      </div>
      <div class="group">
        <div class="row">
          <button id="record">● Record 8s</button>
        </div>
        <span class="hint" id="status">loading avatar…</span>
      </div>
    </div>
    <div id="fps"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
